apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/project-koku/koku?rev={{ revision }}
    build.appstudio.redhat.com/commit_sha: '{{ revision }}'
    build.appstudio.redhat.com/pull_request_number: '{{ pull_request_number }}'
    build.appstudio.redhat.com/target_branch: '{{ target_branch }}'
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch == "main"
    pipelinesascode.tekton.dev/pipeline: "https://raw.githubusercontent.com/project-koku/koku-ci/codex/cost-8649-hermetic/pipelines/pipeline-build.yaml"
  creationTimestamp: null

  labels:
    appstudio.openshift.io/application: koku
    appstudio.openshift.io/component: koku-onprem
    pipelines.appstudio.openshift.io/type: build

  namespace: cost-mgmt-dev-tenant
  name: koku-onprem-pr

spec:
  taskRunTemplate:
    serviceAccountName: build-pipeline-koku-onprem

  params:
    - name: git-url
      value: '{{ source_url }}'

    - name: revision
      value: '{{ revision }}'

    - name: output-image
      value: quay.io/redhat-user-workloads/cost-mgmt-dev-tenant/koku-onprem:pr-{{ pull_request_number }}-latest

    - name: image-expires-after
      value: 5d

    - name: dockerfile
      value: Dockerfile.onprem

    - name: path-context
      value: .

    - name: hermetic
      value: "true"

    - name: build-source-image
      value: "true"

    - name: prefetch-input
      value: >-
        [{"type":"pip","path":".","requirements_files":["requirements-onprem.txt"],"requirements_build_files":["requirements-build.txt","requirements-build-tools.txt"],"binary":{"packages":"maturin,patchelf","os":"linux","arch":"x86_64","py_version":312,"py_impl":"cp"}},{"type":"rpm","path":"."}]

    - name: build-args
      value:
        - IMAGE_NAME=costmanagement/costmanagement-server-rhel9

  pipelineRef:
    name: pipeline-build

  workspaces:
    - name: git-auth
      secret:
        secretName: '{{ git_auth_secret }}'
